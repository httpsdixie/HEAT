<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORCHID | GIS Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='6' fill='%23a6c4ee'/><ellipse cx='24' cy='10' rx='4' ry='7' fill='%235274aa'/><ellipse cx='24' cy='38' rx='4' ry='7' fill='%23364b76'/><ellipse cx='10' cy='24' rx='7' ry='4' fill='%235274aa'/><ellipse cx='38' cy='24' rx='7' ry='4' fill='%23364b76'/></svg>" />
  <link rel="stylesheet" href="../css/theme.css?v=ormoc-navy-5" />
  <link rel="stylesheet" href="../css/layout.css?v=profile-settings-3" />
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="../css/dashboard.css?v=78" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" class="sidebar-slot"></div>
    <div class="main-wrapper">
      <div id="header-mount" class="header-slot"></div>
      <main class="dashboard-viewport">
        <div class="map-card" id="map-telemetry-card">
          <aside class="map-add-sensor-panel" id="add-sensor-panel" aria-label="Manage sensor map placements">
            <div class="map-add-sensor-title">
              <button type="button" class="map-panel-icon-btn" id="btn-collapse-sensor-panel" aria-expanded="true" aria-label="Toggle Place Sensor Node panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <span class="map-panel-title-text">Place Sensor Node</span>
            </div>
            <div id="sensor-panel-body">
              <div class="map-add-sensor-body">
                <div class="sensor-form-row">
                  <label class="sensor-form-label" for="asf-node-id">Node ID</label>
                  <select class="sensor-form-select" id="asf-node-id" data-dropdown disabled>
                    <option value="">Choose an unplaced node</option>
                  </select>
                </div>
                <div class="sensor-form-row">
                  <label class="sensor-form-label" for="asf-map-location">Place on map</label>
                  <select class="sensor-form-select" id="asf-map-location" data-dropdown disabled>
                    <option value="">Pin or choose a place</option>
                  </select>
                </div>
                <div class="sensor-form-row">
                  <label class="sensor-form-label" for="asf-location">Node Name</label>
                  <input class="sensor-form-input" id="asf-location" type="text" placeholder="e.g. Brgy. Libertad Station" maxlength="48" autocomplete="off" disabled />
                </div>
                <div class="map-add-sensor-actions">
                  <button type="button" class="map-add-sensor-action map-add-sensor-action--save" id="btn-save-sensor" disabled>
                    Save Placement
                  </button>
                  <button type="button" class="map-add-sensor-action" id="btn-cancel-placement" hidden>
                    Cancel
                  </button>
                </div>
                <p class="map-data-status" id="map-data-status" role="status" hidden>Connecting to the sensor database…</p>
              </div>
            </div>
          </aside>



          <div class="map-viewport">
            <div id="ormoc-map" class="leaflet-map" role="application" aria-label="Interactive map of Ormoc City"></div>
            <aside class="map-legend" aria-label="Map legend">
              <div class="map-legend-title">
                <button type="button" class="map-panel-icon-btn" id="btn-collapse-legend" aria-expanded="true" aria-label="Toggle map legend">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                    <line x1="9" y1="3" x2="9" y2="18"/>
                    <line x1="15" y1="6" x2="15" y2="21"/>
                  </svg>
                </button>
                <span class="map-panel-title-text">Sensor Nodes Map Legend</span>
              </div>
              <div id="legend-body">
                <div class="map-legend-content">
                  <div class="map-legend-total" id="map-legend-total">0 Sensor Nodes</div>
                  <div class="map-legend-row">
                    <span class="map-legend-status"><span class="map-legend-dot online"></span>Online Nodes</span>
                    <button type="button" class="map-legend-switch" data-map-layer="online" role="switch" aria-checked="true" aria-label="Show online sensor nodes"></button>
                  </div>
                  <div class="map-legend-row">
                    <span class="map-legend-status"><span class="map-legend-dot offline"></span>Offline Nodes</span>
                    <button type="button" class="map-legend-switch" data-map-layer="offline" role="switch" aria-checked="true" aria-label="Show offline sensor nodes"></button>
                  </div>
                </div>
              </div>
            </aside>
            <div class="map-open-hint" aria-hidden="true">No sensor nodes have been placed on the map yet.</div>
            <div class="map-tile-error" id="map-tile-error" role="status">Map could not be initialized.</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-mount"></div>
  <div id="modal-mount"></div>

  <script src="../components/components.js?v=54"></script>
  <script src="../vendor/leaflet/leaflet.js"></script>
  <script src="../js/ormoc-map-data.js?v=3"></script>
  <script src="../js/dashboard.js?v=99"></script>
</body>
</html>
