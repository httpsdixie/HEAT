<template id="orchid-node-search-template">
  <div class="orchid-node-search" role="combobox" aria-haspopup="listbox" aria-expanded="false">

    <!-- Input row -->
    <div class="ons-input-wrap">
      <svg class="ons-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        class="ons-input"
        type="search"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Search nodes…"
        aria-label="Search sensor nodes"
        aria-autocomplete="list"
        aria-controls="ons-listbox"
      />
      <!-- Chevron button — opens list when idle, clears when query is typed -->
      <button class="ons-clear-btn" type="button" aria-label="Show node list" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
    </div>

    <!-- Results listbox -->
    <ul class="ons-listbox" id="ons-listbox" role="listbox" hidden></ul>

  </div>
</template>
