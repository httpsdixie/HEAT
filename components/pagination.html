<template id="orchid-pagination-template">
  <div class="orchid-pagination" role="navigation" aria-label="Pagination">

    <!-- Left: showing info -->
    <span class="opg-info" aria-live="polite"></span>

    <!-- Right: controls -->
    <div class="opg-controls">
      <button class="opg-btn opg-prev" type="button" aria-label="Previous page" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="12" height="12">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
        Previous
      </button>

      <div class="opg-pages" role="list"></div>

      <button class="opg-btn opg-next" type="button" aria-label="Next page" disabled>
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="12" height="12">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

  </div>
</template>
